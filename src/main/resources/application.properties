spring.application.name=food-app


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


spring.security.oauth2.resourceserver.jwt.issuer-uri=${spring_sec_issuer}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring_sec_jwk_set}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256,RS256
supabase.url=${s_url}
supabase.anon-key=${SUPABASE_ANON_KEY}

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.password-reset-redirect-url=http://localhost:8080/api/auth/recovery-callback
#app.password-reset-redirect-url=${PASSWORD_RESET_REDIRECT_URL:http://localhost:5173/reset-password}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.cookie.secure=false
app.cookie.same-site=Lax